<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acum 20th Birthday Special OS</title>
    <style>
        :root {
            --accent: #ff2a5f;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-card: rgba(30, 15, 45, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0a0410;
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* AMBIENT BACKGROUND */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
        }
        .blob-1 { width: 320px; height: 320px; background: #ff2a5f; top: -60px; left: -60px; }
        .blob-2 { width: 380px; height: 380px; background: #7209b7; bottom: -100px; right: -60px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 60px) scale(1.1); }
        }

        /* CONTAINER */
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: rgba(15, 8, 25, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            padding: 20px 16px 50px 16px;
        }

        /* LOCK SCREEN */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 4, 16, 0.9);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s;
        }
        .lock-time { font-size: 3.5rem; font-weight: 200; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .lock-date { font-size: 0.9rem; color: #ffb3c1; margin-bottom: 25px; }
        .lock-title { font-size: 0.85rem; color: rgba(255,255,255,0.8); margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
        
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); transition: 0.2s; }
        .dot.active { background: #ff2a5f; border-color: #ff2a5f; box-shadow: 0 0 12px #ff2a5f; }
        .dot.error { animation: shake 0.4s ease-in-out; border-color: #ff0055; background: #ff0055; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 270px; }
        .key {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.4rem; font-weight: 500;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .key:active { background: rgba(255, 42, 95, 0.5); transform: scale(0.92); }
        .key-hint { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 20px; text-align: center; }

        /* HEADER BANNER */
        .header-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, rgba(255, 42, 95, 0.25), rgba(114, 9, 183, 0.25));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .avatar-box {
            width: 55px; height: 55px;
            border-radius: 18px;
            background: linear-gradient(135deg, #ff2a5f, #7209b7);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.4);
        }
        .header-info h1 { font-size: 1.1rem; font-weight: 800; background: linear-gradient(to right, #ffffff, #ffb3c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-info p { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 2px; }

        /* MASONRY GRID LAYOUT (BENTUK DUA/TIGA UKURAN) */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .widget-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 16px;
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .widget-card:active { transform: scale(0.95); background: rgba(255, 42, 95, 0.25); }

        /* DUA KOLOM LEBAR (WIDE BANNER) */
        .span-2 { grid-column: span 2; }

        .w-badge {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(255, 42, 95, 0.8);
            color: white; font-size: 0.6rem; font-weight: 800;
            padding: 2px 7px; border-radius: 10px;
        }
        .w-icon { font-size: 1.8rem; margin-bottom: 8px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .w-title { font-size: 0.9rem; font-weight: 700; color: #ffffff; }
        .w-sub { font-size: 0.72rem; color: rgba(255,255,255,0.65); margin-top: 3px; }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: linear-gradient(145deg, rgba(30, 15, 45, 0.95), rgba(15, 8, 25, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 360px;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255,42,95,0.2);
            text-align: center;
            animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 80vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            from { transform: scale(0.7) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title { font-size: 1.1rem; font-weight: 700; color: #ff758c; margin-bottom: 12px; }
        .modal-body { font-size: 0.88rem; line-height: 1.6; color: rgba(255,255,255,0.9); }

        .btn-main {
            background: linear-gradient(135deg, #ff2a5f, #ff758c);
            color: white; border: none; padding: 12px 20px; border-radius: 14px;
            font-weight: 700; font-size: 0.85rem; margin-top: 15px; cursor: pointer; width: 100%;
            box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4); transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-close { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }

        /* SPECIFIC WIDGET ELEMENTS */
        .finger-box { width: 65px; height: 65px; border-radius: 50%; border: 2px dashed #ff2a5f; margin: 15px auto; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; }
        .finger-box.scanning { border-style: solid; box-shadow: 0 0 25px #ff2a5f; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.1); } }

        #gameCanvas { width: 100%; height: 150px; background: rgba(0,0,0,0.3); border-radius: 14px; position: relative; overflow: hidden; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .falling-item { position: absolute; font-size: 24px; cursor: pointer; animation: fallAnim 1.8s linear forwards; }
        @keyframes fallAnim { to { transform: translateY(160px); } }

        .music-bar { display: flex; align-items: center; justify-content: center; gap: 4px; height: 26px; margin: 10px 0; }
        .bar-line { width: 4px; background: #ff2a5f; border-radius: 4px; animation: bounce 0.6s infinite alternate ease-in-out; }
        .bar-line:nth-child(2) { animation-delay: 0.15s; }
        .bar-line:nth-child(3) { animation-delay: 0.3s; }
        .bar-line:nth-child(4) { animation-delay: 0.45s; }
        @keyframes bounce { from { height: 6px; } to { height: 24px; } }

        /* BANNER CAM CAMERA SALTING */
        .cam-frame { width: 100%; height: 180px; background: #000; border-radius: 14px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px solid #ff2a5f; }
        .cam-frame img { width: 100%; height: 100%; object-fit: cover; }
        .cam-scanline { position: absolute; width: 100%; height: 3px; background: #ff2a5f; top: 0; animation: scan 1.5s infinite linear; box-shadow: 0 0 12px #ff2a5f; z-index: 2; }
        .cam-overlay-text { position: absolute; bottom: 8px; left: 0; width: 100%; background: rgba(0,0,0,0.65); padding: 5px; z-index: 3; }
        @keyframes scan { to { top: 100%; } }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>

    <!-- LOCK SCREEN -->
    <div id="lockScreen">

        <div class="pin-dots" id="pinDots">
            <div class="dot"></div>

            <div class="dot"></div>

    <!-- POPUP MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-title" id="mTitle">Fitur</div>

            <button class="btn-main btn-close" onclick="closeModal()">Tutup Menu ✖</button>
        </div>

    <div id="ytPlayerSpace" style="display:none"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type = 'sine', duration = 0.15) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playUnlockSound() {
            playTone(440, 'triangle', 0.1);
            setTimeout(() => playTone(880, 'triangle', 0.2), 100);
            setTimeout(() => playTone(1320, 'sine', 0.3), 200);
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('lockClock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000); updateClock();

        let inputPin = "";
        const validPins = ["1310", "2026", "0020", "20"];

        function pressKey(num) {
            playTone(600, 'sine', 0.08);
            if(inputPin.length < 4) {
                inputPin += num; updateDots();
                if(inputPin.length === 4 || inputPin === "20") setTimeout(checkPin, 150);
            }
        }

        function deleteKey() {
            playTone(300, 'sine', 0.08);
            inputPin = inputPin.slice(0, -1); updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if(idx < inputPin.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function checkPin() {
            if(validPins.includes(inputPin) || inputPin === "20") {
                playUnlockSound();
                document.getElementById('lockScreen').style.transform = 'translateY(-100%)';
                document.getElementById('lockScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('lockScreen').style.display = 'none', 600);
            } else {
                playTone(150, 'sawtooth', 0.3);
                const dots = document.querySelectorAll('.dot');
                dots.forEach(d => d.classList.add('error'));
                setTimeout(() => {
                    dots.forEach(d => d.classList.remove('error'));
                    inputPin = ""; updateDots();
                }, 500);
            }
        }

        let ytPlayer;
        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayerSpace', {
                height: '0', width: '0', videoId: 'Hr0AAqHLLSg',
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'Hr0AAqHLLSg' }
            });
        }

        const photoUrl = "https://i.ibb.co.com/wNXBwTzX/image.jpg";

        /* DENGAN SPAN-2 UNTUK MASONRY LAYOUT DYNAMISM */
        const widgets = [
            { span: "span-2", icon: "💌", title: "Surat Pembuka Nyaman", sub: "Pesan spesial ultah kepala dua", body: "Selamat ulang tahun yang ke-20, Acum sayang! 🎂<br><br>Di umur kepala dua ini, semoga makin dewasa, sehat selalu, dan lancar rezekinya. Makasih udah selalu sabar ngadepin aku selama ini. You are my safe place! 💕" },
            { span: "span-2", icon: "📷", title: "Detektor Salting Face Scan", sub: "Pemindai ekspresi Acum live", body: `<div class="cam-frame"><img src="${photoUrl}" onerror="this.src='https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400';" alt="Acum"><div class="cam-scanline"></div><div class="cam-overlay-text"><p id="camTxt" style="font-size:0.8rem; font-weight:bold; color:#ffb3c1;">Menguji Tingkat Salting...</p></div></div><button class="btn-main" onclick="scanSalting()">Pindai Wajah Acum ⚡</button>` },
            { span: "", icon: "🔮", title: "Pengacak Doa", sub: "Kocok harapan hari ini", body: "<p id='dBox'>Klik tombol di bawah buat kocok doa hari ini!</p><button class='btn-main' onclick='acakDoa()'>Kocok Doa ✨</button>" },
            { span: "", icon: "🎟️", title: "Vending Kupon", sub: "Klaim tiket hadiah nyata", body: "<p id='kBox'>Ambil tiket hadiah nyata khusus dari aku!</p><button class='btn-main' onclick='ambilKupon()'>Klaim Tiket 🪙</button>" },
            { span: "span-2", icon: "🎵", title: "Pemutar Latar Musik", sub: "Backsound romantis otomatis", body: "<p>Lagu romantis sudah terintegrasi otomatis.</p><div class='music-bar'><div class='bar-line'></div><div class='bar-line'></div><div class='bar-line'></div><div class='bar-line'></div></div><button class='btn-main' style='background:#2ec4b6;' onclick='ytPlayer.playVideo()'>▶ Play</button><button class='btn-main' style='background:#e71d36; margin-top:5px;' onclick='ytPlayer.pauseVideo()'>⏸ Pause</button>" },
            { span: "", icon: "❤️", title: "Tamagotchi Hati", sub: "Rawat mood Acim", body: "<p>Rawat mood aku biar ga gampang ngambek hari ini:</p><div style='background:rgba(255,255,255,0.1); height:12px; border-radius:6px; margin:15px 0; overflow:hidden;'><div id='mBar' style='width:50%; height:100%; background:#ff2a5f; transition:0.3s;'></div></div><button class='btn-main' onclick='tambahMood()'>Kirim Pelukan (+20%) 🤗</button>" },
            { span: "", icon: "🎮", title: "Game Tangkap Kue", sub: "Mini game sederhana", body: "<p>Tangkap 5 kue jatuh! Skor: <span id='skor' style='color:#ff758c; font-weight:bold;'>0</span></p><div id='gameCanvas'></div>" },
            { span: "", icon: "📸", title: "Album Memori", sub: "Momen manis berdua", body: "🌌 <strong>Momen Favorit:</strong> Ingat pas kita jalan bareng dan kamu ketawa denger cerita random aku? Momen simpel tapi paling bikin aku bahagia banget!" },
            { span: "", icon: "☝️", title: "Sidik Jari Bucin", sub: "Verifikasi kadar cinta", body: "<p>Tahan jempol kamu di bawah untuk verifikasi:</p><div class='finger-box' id='fBox' onmousedown='startFinger()' onmouseup='endFinger()' ontouchstart='startFinger()' ontouchend='endFinger()'>👍</div><p id='fTxt' style='font-size:0.75rem; color:#ffb3c1;'>Tekan & Tahan 2 Detik</p>" },
            { span: "span-2", icon: "✍️", title: "Catatan Wishlist Umur 20", sub: "Tulis impian kamu disini", body: "<textarea style='width:100%; height:70px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:10px; color:white; padding:8px; font-size:0.8rem; resize:none;' placeholder='Tulis keinginan kamu di umur 20...'></textarea><button class='btn-main' onclick='alert(\"Catatan tersimpan!\")'>Simpan Ke Sistem</button>" },
            { span: "", icon: "🍫", title: "Cokelat Manis", sub: "Hadiah manis digital", body: "🍫 *KLIK!* Satu batang cokelat digital termanis berhasil dikirim ke layar HP Acum ter-ganteng hari ini!" },
            { span: "", icon: "🩹", title: "Penawar Ngambek", sub: "Kapsul penenang instan", body: "Kapsul Penenang Instan! 💊<br>Kalau nanti aku tiba-tiba ngambek atau rewel, kamu berhak nunjukkin fitur ini buat bikin aku jinak lagi. 🤪" },
            { span: "", icon: "🗺️", title: "Rencana Target", sub: "Checklist masa depan", body: "<div style='text-align:left; font-size:0.85rem; line-height:2;'><input type='checkbox' checked disabled> Lulus & Sukses Karir<br><input type='checkbox' checked disabled> Culinary Date Berdua<br><input type='checkbox' checked disabled> Menua Bersama Selamanya</div>" },
            { span: "", icon: "🔔", title: "Pengingat Sehat", sub: "Pesan perhatian", body: "Jangan terlalu sibuk main game/kerja ya. Inget minum air putih hari ini, aku ga mau kamu sampai sakit! 🥤" },
            { span: "", icon: "🥳", title: "Efek Pesta", sub: "Konfeti meriah", body: "🎉 KABOOM! Selamat Ulang Tahun yang paling meriah untuk cowok kesayangan aku! 🎉" },
            { span: "", icon: "💡", title: "Pesan Motivasi", sub: "Semangat kepala dua", body: "\"Kamu jauh lebih hebat dan kuat dari apa yang kamu pikirkan. Selamat memasuki usia 20 tahun dengan percaya diri!\" 💪✨" },
            { span: "", icon: "🤝", title: "Janji Setia", sub: "Kontrak rasa sayang", body: "Dengan membuka fitur ini, Acum berjanji akan selalu sayang sama Acim, bersabar menghadapi segala drama kecil, dan tidak berpaling. ❤️" },
            { icon: "🔋", span: "", title: "Pengisi Energi", sub: "Baterai jiwa 100%", body: "🔋 *BZZZT...* Daya energi jiwa kamu sedang diisi ulang 100% pakai pasokan cinta penuh dari aku!" },
            { icon: "✨", span: "", title: "Hujan Balon", sub: "Atmosfer pesta", body: "🎈 Atmosfer kebahagiaan pesta ulang tahunmu diciptakan khusus biar HP kamu terasa sangat meriah!" },
            { span: "span-2", icon: "🔒", title: "Kapsul Waktu Terkunci", sub: "Surat rahasia terakhir", body: "🔒 <strong>Pesan Rahasia Terakhir:</strong><br><br>Makasih udah buka semua fiturnya! Kamu beneran cowok terbaik yang pernah ada di hidup aku. Jangan pernah bosan sama aku ya. Happy 20th Birthday, Acum sayang! 🤍✨" }
        ];

        const gridEl = document.getElementById('widgetGrid');
        widgets.forEach((w, i) => {
            const card = document.createElement('div');
            card.className = `widget-card ${w.span}`;
            card.onclick = () => openWidget(i);
            card.innerHTML = `
                <span class="w-badge">#${i+1}</span>
                <div>
                    <div class="w-icon">${w.icon}</div>
                    <div class="w-title">${w.title}</div>
                    <div class="w-sub">${w.sub}</div>
                </div>
            `;
            gridEl.appendChild(card);
        });

        function openWidget(idx) {
            playTone(800, 'sine', 0.1);
            document.getElementById('mTitle').innerText = widgets[idx].title;
            document.getElementById('mBody').innerHTML = widgets[idx].body;
            document.getElementById('modal').style.display = 'flex';
            if(idx === 6) startMiniGame();
        }

        function closeModal() {
            playTone(400, 'sine', 0.08);
            document.getElementById('modal').style.display = 'none';
        }

        function acakDoa() {
            playTone(900, 'sine', 0.1);
            const list = ["Semoga makin lancar rezekinya! 💸", "Semoga sehat terus badan & jiwanya! 💪", "Semoga makin sayang sama aku! 🥰"];
            document.getElementById('dBox').innerText = list[Math.floor(Math.random()*list.length)];
        }

        function ambilKupon() {
            playTone(1000, 'triangle', 0.15);
            const listK = ["🎟️ Kupon Traktir Es Krim Jumbo", "🎟️ Kupon Peluk 10 Menit", "🎟️ Kupon Bebas Pilih Tempat Makan"];
            document.getElementById('kBox').innerHTML = `<strong>Tiket Keluar:</strong><br>${listK[Math.floor(Math.random()*listK.length)]} (Screenshot!)`;
        }

        let mVal = 50;
        function tambahMood() {
            playTone(1100, 'sine', 0.1);
            mVal = Math.min(100, mVal + 20);
            document.getElementById('mBar').style.width = mVal + '%';
        }

        let gScore = 0;
        function startMiniGame() {
            gScore = 0;
            const area = document.getElementById('gameCanvas');
            area.innerHTML = '';
            const iv = setInterval(() => {
                if(document.getElementById('modal').style.display === 'none' || gScore >= 5) { clearInterval(iv); return; }
                const item = document.createElement('div');
                item.className = 'falling-item'; item.innerText = '🍰';
                item.style.left = Math.random() * (area.clientWidth - 30) + 'px'; item.style.top = '0px';
                item.onclick = () => {
                    playTone(1200, 'sine', 0.08);
                    gScore++; document.getElementById('skor').innerText = gScore; item.remove();
                    if(gScore === 5) alert("Hebat! Target 5 Kue Terkumpul! 🏆");
                };
                area.appendChild(item);
                setTimeout(() => item.remove(), 1700);
            }, 800);
        }

        function scanSalting() {
            playTone(700, 'sawtooth', 0.2);
            document.getElementById('camTxt').innerText = "Memindai Rona Pipi...";
            setTimeout(() => {
                playTone(1400, 'sine', 0.3);
                document.getElementById('camTxt').innerText = "RESULT: 1000% SALTING MAMPUS! 😳❤️";
            }, 1500);
        }

        let fTimer;
        function startFinger() {
            playTone(500, 'sine', 0.1);
            document.getElementById('fBox').classList.add('scanning');
            document.getElementById('fTxt').innerText = "Memindai...";
            fTimer = setTimeout(() => {
                playTone(1500, 'sine', 0.3);
                document.getElementById('fTxt').innerText = "VERIFIED: 9999% BUCIN PARAH! 🥰";
            }, 1800);
        }
        function endFinger() {
            clearTimeout(fTimer);
            document.getElementById('fBox').classList.remove('scanning');
        }
    </script>
</body>
</html>
