        // Web Audio API Synthesizer (Untuk sound effect premium buatan sendiri)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playChime() {
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch (e) { console.log(e); }
        }

        function playPop() {
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } catch (e) { console.log(e); }
        }

                    'onReady': (event) => {
                        event.target.mute();
                        event.target.setVolume(70);
                    }
                }
            });
        }

                        <button onclick="blowCandle()" class="w-full bg-gradient-to-r from-love-500 to-yellow-500 py-2.5 rounded-xl font-bold text-white text-xs active:scale-95 transition-all">TIUP LILINNYA! 🎉</button>
                    </div>
                `
            },
            16: {
                title: "<i class='fa-solid fa-lightbulb text-love-400'></i> 16. Lentera Kata Penyemangat",
                body: `
                    <div class="text-center">
                        <span class="text-4xl">💡</span>
                        <h4 class="font-bold text-white mt-2 mb-3">Pesan Penguat Hatimu</h4>
                        <p class="text-xs text-neutral-300 leading-relaxed italic">
                            "Kamu jauh lebih hebat, kuat, dan luar biasa dari yang kamu duga. Jangan pernah ragu dengan kemampuanmu sendiri ya ganteng. Aku akan selalu ada di belakangmu, mendukung semua mimpimu."
                        </p>
                    </div>
                `
            },
            17: {
                title: "<i class='fa-solid fa-handshake-simple text-love-400'></i> 17. Surat Kontrak Komitmen",
                body: `
                    <div class="text-left bg-white/5 p-4 rounded-2xl border border-white/10">
                        <p class="text-xs text-neutral-300 leading-relaxed mb-4">
                            Dengan membuka level ini, Acum berjanji akan terus memeluk erat Acim, tidak gampang bosan, sabar menghadapi tingkah gemesku, dan selalu setia selamanya. ❤️
                        </p>
                        <button onclick="alert('Kontrak ditandatangani dengan cinta selamanya!')" class="w-full bg-love-500 text-white py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">TANDA TANGANI KONTRAK ✍️</button>
                    </div>
                `
            },
            18: {
                title: "<i class='fa-solid fa-battery-full text-love-400'></i> 18. Pengisi Daya Energi Jiwa",
                body: `
                    <div class="text-center">
                        <span class="text-4xl">⚡</span>
                        <p class="text-xs text-neutral-300 mt-2">Daya energi jiwa kamu terdeteksi lemah akibat rutinitas:</p>
                        <div class="bg-white/5 h-4 rounded-full overflow-hidden my-4 border border-white/10 relative">
                            <div id="batBar" class="bg-green-500 h-full transition-all duration-1000" style="width: 20%"></div>
                            <span id="batVal" class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white">20%</span>
                        </div>
                        <button onclick="chargeEnergy()" class="w-full bg-green-600 text-white py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">ISI ULANG DENGAN CINTA ACIM 🔋</button>
                    </div>
                `
            },
            19: {
                title: "<i class='fa-solid fa-snowflake text-love-400'></i> 19. Hujan Salju Romantis",
                body: `
                    <div class="text-center">
                        <span class="text-4xl">❄️</span>
                        <h4 class="font-bold text-white mt-2">Atmosfer Dingin tapi Hangat</h4>
                        <p class="text-xs text-neutral-300 mt-2 leading-relaxed">
                            Aku menyalakan fitur hujan partikel khusus untuk mendinginkan pikiranmu yang lelah seharian. Rasakan ketenangan ini sambil dengerin lagunya ya sayang...
                        </p>
                    </div>
                `
            },
            20: {
                title: "<i class='fa-solid fa-lock-open text-love-400'></i> 20. Kotak Surat Rahasia Terdalam",
                body: `
                    <div class="text-center">
                        <span class="text-4xl">🔒</span>
                        <p class="text-xs text-neutral-300 mt-2 mb-4">Misi terakhir selesai! Akses surat rahasia pamungkas dari relung hati terdalamku:</p>
                        <button onclick="revealUltimateLetter()" class="w-full bg-gradient-to-r from-love-600 to-purple-600 text-white py-3 rounded-xl text-xs font-bold shadow-lg shadow-love-500/20 active:scale-95 transition-all">BUKA SURAT UTAMA 👑</button>
                    </div>
                `
            }
        };

        function openFeature(num) {
            playPop();
            const f = contentData[num];
            document.getElementById('popTitle').innerHTML = f.title;
            document.getElementById('popBody').innerHTML = f.body;
            document.getElementById('popup').style.display = 'flex';
            
            // Inisialisasi game jika membuka panel game
            if(num === 5) setTimeout(initGame, 100);
        }

        function closeFeature() {
            playPop();
            document.getElementById('popup').style.display = 'none';
        }

        // Feature 2: Fingerprint Scan
        function startFingerprint() {
            playPop();
            const msg = document.getElementById('scanMsg');
            msg.innerText = "Menganalisis detak jantung...";
            setTimeout(() => {
                msg.innerText = "Membaca tingkat kecocokan...";
                setTimeout(() => {
                    msg.innerHTML = "<span class='text-love-400 text-sm'>9999% SETIA & BUCIN PARAH!</span>";
                    playChime();
                }, 1200);
            }, 1000);
        }

        // Feature 3: Ticket Drawing
        const tickets = [
            "🎟️ BEBAS PILIH TEMPAT MAKAN (Aku yang traktir!)",
            "🎟️ PELUKAN ERAT 15 MENIT NONSTOP",
            "🎟️ BEBAS MARAH-MARAH SEHARIAN (Aku nurut terus)",
            "🎟️ DITEMENIN MAIN GAME SAMPAI BEGADANG"
        ];
        function drawTicket() {
            playPop();
            const res = tickets[Math.floor(Math.random() * tickets.length)];
            document.getElementById('ticketArea').innerHTML = `<div class='animate-bounce text-xs text-center'>${res}<br><span class='text-[10px] text-white/50 font-normal mt-1 block'>*Screenshot tiket ini buat diklaim ke aku!</span></div>`;
            playChime();
        }

        // Feature 4: Tamagotchi
        let petMood = 50;
        function feedPet(amount, emoji) {
            playPop();
            petMood = Math.min(100, petMood + amount);
            document.getElementById('petBar').style.width = petMood + '%';
            const avatar = document.getElementById('petAvatar');
            avatar.innerText = emoji;
            avatar.classList.add('scale-125');
            setTimeout(() => {
                avatar.classList.remove('scale-125');
                if (petMood >= 95) {
                    avatar.innerText = "🥰✨❤️";
                    playChime();
                }
            }, 300);
        }

        // Feature 5: Catch Game
        let gameScore = 0;
        function initGame() {
            gameScore = 0;
            const canvas = document.getElementById('canvasBox');
            if(!canvas) return;
            canvas.innerHTML = '';
            
            const loop = setInterval(() => {
                if(!document.getElementById('canvasBox') || gameScore >= 5) {
                    clearInterval(loop);
                    return;
                }
                const gift = document.createElement('div');
                gift.className = 'falling cursor-pointer absolute';
                gift.innerText = ['🎁','💝','💖','⭐'][Math.floor(Math.random()*4)];
                gift.style.left = Math.random() * (canvas.clientWidth - 30) + 'px';
                gift.style.top = '0px';
                
                gift.onclick = () => {
                    playPop();
                    gameScore++;
                    document.getElementById('gameSkor').innerText = gameScore;
                    gift.remove();
                    if(gameScore === 5) {
                        playChime();
                        alert("Hore! Semua kado cinta sudah kamu kumpulkan! 🏆🎁");
                    }
                };
                canvas.appendChild(gift);
                setTimeout(() => gift.remove(), 1500);
            }, 900);
        }

        // Feature 8: Salting Detector
        function runSaltingScan() {
            playPop();
            const box = document.getElementById('saltingBox');
            box.innerText = "Mengukur suhu pipi...";
            setTimeout(() => {
                box.innerHTML = "<span class='text-red-500 text-2xl animate-pulse'>1000% SALTING MAMPUS!</span><br><span class='text-xs text-neutral-300 font-normal mt-2 block'>Hayo ngaku, pipi kamu langsung merah merona kan pas buka web ini? 😜</span>";
                playChime();
            }, 1500);
        }

        // Feature 11: Wish jar
        const wishes = [
            "Semoga kamu sehat selalu, gak gampang capek badannya ya ganteng! 💪",
            "Lancar rezekinya, sukses kuliah atau kerjanya, dimudahkan semua urusan! 💸",
            "Makin sayang, makin sabar, dan menua bersamaku selamanya! 🥰",
            "Semoga semua impian besarmu terkabul satu per satu tahun ini! ✨"
        ];
        function rollWish() {
            playPop();
            document.getElementById('wishOutput').innerText = wishes[Math.floor(Math.random() * wishes.length)];
            playChime();
        }

        // Feature 15: Blow Candle
        function blowCandle() {
            playPop();
            const candle = document.getElementById('candle');
            candle.innerText = "🎂✨🎉";
            playChime();
            alert("Lilin ditiup! Selamat ulang tahun kesayangan aku! Semoga panjang umur dan bahagia selalu! 🥳🎂");
        }

        // Feature 18: Soul Charger
        function chargeEnergy() {
            playPop();
            document.getElementById('batBar').style.width = '100%';
            document.getElementById('batVal').innerText = '100% ENERGY FULL';
            playChime();
        }

        // Feature 20: Ultimate Letter
        function revealUltimateLetter() {
            playPop();
            document.getElementById('popBody').innerHTML = `
                <div class="text-justify leading-relaxed space-y-4">
                    <p class="font-romantic text-2xl text-center text-love-400">Teruntuk Acum, Semesta Cintaku.</p>
                    <p class="text-xs text-neutral-300 leading-relaxed">
                        Makasih banyak ya sudah mau berjuang bareng aku sampai sejauh ini. Aku tau aku jauh dari kata sempurna, sering rewel, kekanakan, bahkan suka bikin kamu capek sendiri ngadepin tingkah laku aku. 😔
                    </p>
                    <p class="text-xs text-neutral-300 leading-relaxed">
                        Tapi kamu tetep milih tinggal, tetep sabar, tetep meluk semua kekurangan aku tanpa pernah ngeluh. Kehadiran kamu tuh beneran jadi berkah paling indah di hidup aku. Aku gak bisa bayangin hari-hariku tanpa canda tawa dan pesan manis darimu.
                    </p>
                    <p class="text-xs text-neutral-300 leading-relaxed">
                        Selamat ulang tahun yang ke-20 ya, sayangku. Semoga kita bisa terus bergandengan tangan, melewati banyak rintangan, dan merayakan ulang tahun berikutnya bareng-bareng lagi. Aku sayang kamu hari ini, esok, dan selamanya. Mwah! 🤍✨
                    </p>
                    <p class="text-right font-romantic text-lg text-love-400">— Sayangmu, Acim 💖</p>
                </div>
            `;
            playChime();
        }

        // GLOBAL BACKGROUND CONFETTI ANIMATION EFFECT
        setInterval(() => {
            const p = document.createElement('div');
            p.innerText = ['🎈','💖','✨','🌸'][Math.floor(Math.random()*4)];
            p.style.position = 'fixed';
            p.style.top = '-20px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = Math.floor(Math.random() * 15 + 15) + 'px';
            p.style.pointerEvents = 'none';
            p.style.zIndex = '5';
            p.style.opacity = '0.7';
            p.style.transition = 'transform 3.5s linear, opacity 3.5s';
            document.body.appendChild(p);
            
            setTimeout(() => {
                p.style.transform = `translateY(105vh) rotate(${Math.random()*360}deg)`;
            }, 50);
            
            setTimeout(() => p.remove(), 3500);
        }, 500);
    </script>
</body>
</html>
