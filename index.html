<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 20th Birthday Acum 💕</title>
    <style>
        :root {
            --pink-main: #ff6584;
            --pink-soft: #ffb3c1;
            --pink-bg: #fff0f3;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 182, 193, 0.5);
            --text-dark: #4a2e35;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(135deg, #ffccd5, #ffe5ec, #ff8fab);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND FLOATING HEARTS & SPARKLES */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* CONTAINER UTAMA (HP MOCKUP) */
        .app-container {
            width: 100%;
            max-width: 410px;
            min-height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            padding: 24px 18px 40px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(255, 101, 132, 0.25);
        }

        /* LOCK SCREEN CUTE PINK */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 224, 230, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s;
        }
        .lock-time { font-size: 3.8rem; font-weight: 300; color: #d90429; text-shadow: 0 4px 15px rgba(217, 4, 41, 0.15); }
        .lock-date { font-size: 0.95rem; color: #ff4d6d; margin-bottom: 25px; font-weight: 600; }
        .lock-title { font-size: 0.85rem; color: #6b3e4a; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
        
        .pin-dots { display: flex; gap: 15px; margin-bottom: 35px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ff4d6d; transition: 0.2s; }
        .dot.active { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }
        .dot.error { animation: shake 0.4s ease-in-out; border-color: #d90429; background: #d90429; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 270px; }
        .key {
            aspect-ratio: 1;
            border-radius: 50%;
            background: white;
            border: 2px solid #ffb3c1;
            color: #d90429;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 101, 132, 0.15);
            transition: 0.15s;
        }
        .key:active { background: #ff4d6d; color: white; transform: scale(0.92); }
        .key-hint { font-size: 0.75rem; color: #8c5563; margin-top: 25px; text-align: center; font-weight: 600; }

        /* HEADER CUTE */
        .header {
            text-align: center;
            background: linear-gradient(135deg, #ffffff, #ffe5ec);
            border: 2px solid #ffb3c1;
            border-radius: 24px;
            padding: 22px 16px;
            box-shadow: 0 8px 25px rgba(255, 101, 132, 0.15);
            margin-bottom: 22px;
        }
        .header h1 { font-size: 1.35rem; font-weight: 800; color: #d90429; }
        .header p { font-size: 0.8rem; color: #8c5563; margin-top: 5px; font-weight: 600; }

        /* GRID 4 FITUR UTAMA */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .card-item {
            background: white;
            border: 2px solid #ffb3c1;
            border-radius: 22px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 18px rgba(255, 101, 132, 0.12);
        }
        .card-item:active { transform: scale(0.93); background: #ffe5ec; }
        .card-item .icon { font-size: 2.5rem; margin-bottom: 10px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.1)); }
        .card-item .card-title { font-size: 0.9rem; font-weight: 700; color: #4a2e35; line-height: 1.3; }

        /* POPUP MODAL CUTE */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(107, 62, 74, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #ffffff;
            border: 3px solid #ffb3c1;
            width: 100%;
            max-width: 360px;
