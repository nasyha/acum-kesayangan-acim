<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player - Afgan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .player-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 320px;
      text-align: center;
    }

    .cover-art {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 48px;
    }

    .song-title {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      margin-bottom: 4px;
    }

    .artist-name {
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    .progress-container {
      background: #e0e0e0;
      height: 6px;
      border-radius: 3px;
      width: 100%;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      background: #4ca1af;
      height: 100%;
      width: 35%;
      border-radius: 3px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #444;
      transition: color 0.2s;
    }

    .btn:hover {
      color: #4ca1af;
    }

    .btn-play {
      width: 50px;
      height: 50px;
      background: #4ca1af;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(76, 161, 175, 0.3);
    }

    .btn-play:hover {
      background: #3b8d9b;
      color: white;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Album Cover / Aesthetic Block -->
    <div class="cover-art">
      🎵
    </div>

    <!-- Song Info -->
    <div class="song-title">Bukan Cinta Biasa</div>
    <div class="artist-name">Afgan</div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    <div class="time-stamps">
      <span>1:24</span>
      <span>4:06</span>
    </div>

    <!-- Minimal Controls -->
    <div class="controls">
      <button class="btn">⏮</button>
      <button class="btn btn-play">▶</button>
      <button class="btn">⏭</button>
    </div>
  </div>

</body>
</html>
