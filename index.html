<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Acum 20th Birthday Special</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #ffe5ec 0%, #ffccd5 100%); min-height: 100vh; color: #2d3748; padding: 15px; padding-bottom: 30px; }
        
        /* BANNER UTAMA */
        .header-banner { text-align: center; background: white; padding: 20px; border-radius: 20px; border: 3px solid #ff4d6d; box-shadow: 0 8px 20px rgba(255,77,109,0.1); margin-bottom: 20px; }
        .header-banner h1 { color: #ff4d6d; font-size: 1.5rem; margin-bottom: 5px; }
        .header-banner p { font-size: 0.8rem; color: #718096; font-weight: 600; }

        /* GRID 20 MENU UTAMA */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .menu-item { background: white; border: 2px solid #ffb3c1; border-radius: 14px; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .menu-item:active { transform: scale(0.9); background: #fff5f6; }
        .menu-item .icon { font-size: 1.6rem; margin-bottom: 2px; }
        .menu-item .num { font-size: 0.65rem; font-weight: bold; color: #ff4d6d; background: #ffe5ec; padding: 1px 5px; border-radius: 8px; }

        /* POPUP KONTEN (BUKA SATU-SATU) */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .popup-box { background: white; width: 100%; max-width: 360px; border-radius: 20px; border: 3px solid #ff4d6d; overflow: hidden; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .popup-header { background: #ff4d6d; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 0.95rem; position: relative; }
        .popup-body { padding: 20px; text-align: center; font-size: 0.9rem; line-height: 1.5; max-height: 60vh; overflow-y: auto; }
        
        /* ISI ELEMEN WIDGET */
        .btn-action { background: #ff758c; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
        .btn-action:active { background: #ff4d6d; }
        .bar-bg { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .bar-fill { height: 100%; background: #ff4d6d; width: 50%; transition: width 0.3s; }
        #gameArea { background: #f1f5f9; height: 150px; position: relative; overflow: hidden; border-radius: 10px; margin-top: 10px; }
        .falling { position: absolute; font-size: 24px; animation: fall 1.5s linear forwards; }
        @keyframes fall { to { transform: translateY(160px); } }
    </style>
</head>
<body>

    <!-- BANNER ATAS -->
    <div class="header-banner">
        <h1>ACUM'S 20th LEVEL UP! 👑</h1>
        <p>Buka & Selesaikan 20 Fitur Gemes Di Bawah Ini</p>
    </div>

    <!-- GRID MENU UTAMA -->
    <div class="menu-grid">
        <div class="menu-item" onclick="openFeature(1)"> <span class="icon">💌</span> <span class="num">1</span> </div>
        <div class="menu-item" onclick="openFeature(2)"> <span class="icon">🔮</span> <span class="num">2</span> </div>
        <div class="menu-item" onclick="openFeature(3)"> <span class="icon">🎟️</span> <span class="num">3</span> </div>
        <div class="menu-item" onclick="openFeature(4)"> <span class="icon">❤️</span> <span class="num">4</span> </div>
        <div class="menu-item" onclick="openFeature(5)"> <span class="icon">🎮</span> <span class="num">5</span> </div>
        <div class="menu-item" onclick="openFeature(6)"> <span class="icon">📸</span> <span class="num">6</span> </div>
        <div class="menu-item" onclick="openFeature(7)"> <span class="icon">🎵</span> <span class="num">7</span> </div>
        <div class="menu-item" onclick="openFeature(8)"> <span class="icon">📊</span> <span class="num">8</span> </div>
        <div class="menu-item" onclick="openFeature(9)"> <span class="icon">🎲</span> <span class="num">9</span> </div>
        <div class="menu-item" onclick="openFeature(10)"> <span class="icon">✍️</span> <span class="num">10</span> </div>
        <div class="menu-item" onclick="openFeature(11)"> <span class="icon">🍫</span> <span class="num">11</span> </div>
        <div class="menu-item" onclick="openFeature(12)"> <span class="icon">🩹</span> <span class="num">12</span> </div>
        <div class="menu-item" onclick="openFeature(13)"> <span class="icon">🗺️</span> <span class="num">13</span> </div>
        <div class="menu-item" onclick="openFeature(14)"> <span class="icon">🔔</span> <span class="num">14</span> </div>
        <div class="menu-item" onclick="openFeature(15)"> <span class="icon">🥳</span> <span class="num">15</span> </div>
        <div class="menu-item" onclick="openFeature(16)"> <span class="icon">💡</span> <span class="num">16</span> </div>
        <div class="menu-item" onclick="openFeature(17)"> <span class="icon">🤝</span> <span class="num">17</span> </div>
        <div class="menu-item" onclick="openFeature(18)"> <span class="icon">🔋</span> <span class="num">18</span> </div>
        <div class="menu-item" onclick="openFeature(19)"> <span class="icon">✨</span> <span class="num">19</span> </div>
        <div class="menu-item" onclick="openFeature(20)"> <span class="icon">🔒</span> <span class="num">20</span> </div>
    </div>

    <!-- WINDOW POPUP BISA DITUTUP -->
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <div class="popup-header" id="popTitle">Fitur</div>
            <div class="popup-body" id="popBody">Konten</div>
            <button class="btn-action" style="background:#4a5568; border-radius:0;" onclick="closeFeature()">TUTUP MENU ❌</button>
        </div>
    </div>

    <div id="audioSpace" style="display:none"></div>

    <script>
        let score = 0, moodVal = 50, audioPlayer = null;

        // LOAD AUDIO YOUTUBE
        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
        function onYouTubeIframeAPIReady() {
            audioPlayer = new YT.Player('audioSpace', { height: '0', width: '0', videoId: 'Hr0AAqHLLSg', playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'Hr0AAqHLLSg' } });
        }

        const dataFitur = {
            1: { title: "1. Surat Pembuka Nyaman 💌", body: "Selamat ulang tahun yang ke-20, Acum sayang! 🎂 Di umur yang berkepala dua ini, semoga kamu makin dewasa, sehat selalu, dan dilancarkan segala urusannya. Makasih udah selalu sabar ngadepin sifat manja aku selama ini. I love you! 💕" },
            2: { title: "2. Pengacak Doa Manis 🔮", body: "<p id='dBox'>Klik tombol di bawah untuk melihat doa acak hari ini!</p><button class='btn-action' onclick='acakDoa()'>Kocok Doa ✨</button>" },
            3: { title: "3. Mesin Tiket Kupon 🎟️", body: "<p id='kBox'>Ambil hadiah nyata dari aku!</p><button class='btn-action' onclick='ambilKupon()'>Klaim Tiket 🪙</button>" },
            4: { title: "4. Tamagotchi Hati Acim ❤️", body: "<p>Rawat mood perasaan aku biar ga gampang ngambek hari ini:</p><div class='bar-bg'><div class='bar-fill' id='mBar' style='width:50%'></div></div><button class='btn-action' onclick='tambahMood()'>Kirim Pelukan (+20%)</button>" },
            5: { title: "5. Mini Game Tangkap Kue 🎮", body: "<p>Tangkap 5 kue jatuh untuk menang! Skor: <span id='skor'>0</span></p><div id='gameArea'></div>" },
            6: { title: "6. Album Memori Kecil 📸", body: "🌌 <strong>Momen Indah:</strong> Ingat pas kita pertama kali jalan dan kamu ketawa denger cerita random aku? Itu memori favorit aku sampai sekarang!" },
            7: { title: "7. Pemutar Musik Latar 🎵", body: "Lagu romantis sudah terintegrasi otomatis. Kamu bisa matikan atau nyalakan lagunya dari sini:<br><br><button class='btn-action' style='background:#48bb78;' onclick='audioPlayer.playVideo()'>NYALAKAN MUSIK</button><button class='btn-action' style='background:#f56565;' onclick='audioPlayer.pauseVideo()'>MATIKAN MUSIK</button>" },
            8: { title: "8. Matriks Kebucinan Real 📊", body: "<p>Scan tingkat kecocokan nama kamu sama aku hari ini:</p><h2 id='bucinSkor' style='margin:10px 0; color:#ff4d6d;'>0%</h2><button class='btn-action' onclick='hitungBucin()'>MULAI SCAN ⚡</button>" },
            9: { title: "9. Angka Keberuntungan Umur 20 🎲", body: "<p>Angka keberuntungan Acum hari ini adalah: <strong>20</strong> (Sesuai umur barumu yang penuh dengan keberkahan!).</p>" },
            10: { title: "10. Papan Ketik Catatan ✍️", body: "<textarea style='width:100%; height:60px; padding:5px; margin-top:5px;' placeholder='Tulis keinginan rahasiamu di sini...'></textarea><button class='btn-action' onclick='alert(\"Tersimpan!\")'>Simpan Wishlist</button>" },
            11: { title: "11. Vending Machine Cokelat 🍫", body: "🍫 *Klik!* Satu cokelat digital termanis sudah dikirim khusus ke layar HP Acum ter-ganteng hari ini!" },
            12: { title: "12. Kotak P3K Anti Ngambek 🩹", body: "Kapsul penenang instan! Kalau nanti aku tiba-tiba rewel atau ngambek, kamu berhak nunjukkin fitur nomor 12 ini buat bikin aku langsung jinak lagi. 🤪" },
            13: { title: "13. Rencana Masa Depan Berdua 🗺️", body: "<div style='text-align:left; padding-left:20px;'><input type='checkbox' checked disabled> Kuliah/Kerja Sukses<br><input type='checkbox' checked disabled> Liburan Nyaman Berdua<br><input type='checkbox' checked disabled> Bahagia Selamanya</div>" },
            14: { title: "14. Pengingat Minum Air 🔔", body: "Jangan terlalu sibuk main game atau kerja ya sayang. Inget minum air putih hari ini, aku gamau kamu sampai jatuh sakit! 🥤" },
            15: { title: "15. Ledakan Konfeti Ultah 🥳", body: "🎉 KABOOM! Selamat ulang tahun yang paling meriah untuk cowok kesayangan aku! Semoga harimu penuh tawa hari ini." },
            16: { title: "16. Kata-Kata Motivasi 💡", body: "\"Kamu jauh lebih kuat dari apa yang kamu pikirkan. Selamat memasuki usia 20 tahun dengan penuh percaya diri, aku selalu dukung kamu!\"" },
            17: { title: "17. Kontrak Janji Setia 🤝", body: "Dengan membuka fitur ini, Acum berjanji akan selalu menyayangi Acim, bersabar menghadapi segala drama kecil, dan tidak akan berpaling. *Ditandatangani dengan cinta* ❤️" },
            18: { title: "18. Pengisi Energi Jiwa 🔋", body: "🔋 *BZZZT...* Daya energi jiwa kamu sedang diisi ulang 100% menggunakan pasokan kasih sayang penuh dari aku!" },
            19: { title: "19. Efek Hujan Balon Layar ✨", body: "Coba liat ke sekeliling layarmu! Atmosfer kebahagiaan pesta ulang tahunmu sengaja diciptakan biar HP kamu terasa meriah." },
            20: { title: "20. Surat Rahasia Terkunci 🔒", body: "🔒 <strong>Pesan Terakhir:</strong> Makasih ya udah buka semua fiturnya sampai nomor 20! Kamu beneran cowok terbaik yang pernah ada di hidup aku. Jangan pernah bosan sama aku ya. Selamat ulang tahun yang ke-20, Acum sayang! 🤍✨" }
        };

        function openFeature(num) {
            document.getElementById('popTitle').innerText = dataFitur[num].title;
            document.getElementById('popBody').innerHTML = dataFitur[num].body;
            document.getElementById('popup').style.display = 'flex';
            if(num === 5) startMiniGame();
        }
        function closeFeature() { document.getElementById('popup').style.display = 'none'; }

        function acakDoa() {
            const list = ["Semoga makin dilancarkan rezekinya! 💸", "Semoga sehat terus badan dan jiwanya! 💪", "Semoga makin sayang sama aku tentunya! 🥰"];
            document.getElementById('dBox').innerText = list[Math.floor(Math.random()*list.length)];
        }
        function ambilKupon() {
            const listK = ["🎟️ Kupon Traktir Es Krim Jumbo", "🎟️ Kupon Peluk 10 Menit", "🎟️ Kupon Bebas Pilih Tempat Makan"];
            document.getElementById('kBox').innerHTML = `<strong>Tiketmu:</strong><br>${listK[Math.floor(Math.random()*listK.length)]} (Screenshot!)`;
        }
        function tambahMood() {
            moodVal = Math.min(100, moodVal + 20);
            document.getElementById('mBar').style.width = moodVal + '%';
        }
        function hitungBucin() {
            let s = 0;
            const iv = setInterval(() => { s += 5; document.getElementById('bucinSkor').innerText = s + '%'; if(s >= 100) { clearInterval(iv); document.getElementById('bucinSkor').innerText = '10000% BUCIN PARAH!'; } }, 20);
        }

        function startMiniGame() {
            score = 0;
            const area = document.getElementById('gameArea');
            area.innerHTML = '';
            const gLoop = setInterval(() => {
                if(document.getElementById('popup').style.display === 'none' || score >= 5) { clearInterval(gLoop); return; }
                const item = document.createElement('div');
                item.className = 'falling'; item.innerText = '🍰';
                item.style.left = Math.random() * (area.clientWidth - 30) + 'px'; item.style.top = '0px';
                item.onclick = () => { score++; document.getElementById('skor').innerText = score; item.remove(); if(score === 5) alert("Kamu Menang! 🏆"); };
                area.appendChild(item);
                setTimeout(() => item.remove(), 1500);
            }, 800);
        }

        // HUJAN PARTIKEL LATAR BELAKANG
        setInterval(() => {
            const p = document.createElement('div');
            p.innerText = ['🎈','🎉','💖','✨'][Math.floor(Math.random()*4)];
            p.style.position = 'fixed'; p.style.top = '-20px'; p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = '20px'; p.style.pointerEvents = 'none'; p.style.zIndex = '50';
            p.style.transition = 'transform 3s linear, opacity 3s';
            document.body.appendChild(p);
            setTimeout(() => { p.style.transform = `translateY(105vh) rotate(${Math.random()*360}deg)`; }, 50);
            setTimeout(() => p.remove(), 3000);
        }, 400);
    </script>
</body>
</html>
