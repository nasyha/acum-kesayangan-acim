<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 20th Birthday Acum 💕 | Special OS Edition</title>
    <style>
        /* ==========================================================================
           1. ROOT VARIABLES & GLOBAL STYLES
           ========================================================================== */
        :root {
            --pink-main: #ff6584;
            --pink-soft: #ffb3c1;
            --pink-light: #ffe5ec;
            --pink-bg: #fff0f3;
            --pink-deep: #d90429;
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(255, 182, 193, 0.65);
            --text-dark: #4a2e35;
            --text-sub: #6b3e4a;
            --shadow-soft: 0 10px 30px rgba(255, 101, 132, 0.18);
            --shadow-glow: 0 0 25px rgba(255, 101, 132, 0.35);
            --radius-large: 28px;
            --radius-medium: 20px;
            --radius-small: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ffccd5 0%, #ffe5ec 50%, #ff8fab 100%);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Custom Scrollbar for Inner Containers */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 229, 236, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--pink-soft);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--pink-main);
        }

        /* ==========================================================================
           2. BACKGROUND ANIMATIONS (BUBBLES & FLOATING PARTICLES)
           ========================================================================== */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.8), 0 4px 15px rgba(255, 179, 193, 0.3);
            animation: floatUp 9s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.85;
            }
            80% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-15vh) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 16px;
            animation: fadeOutSparkle 1s forwards ease-out;
        }

        @keyframes fadeOutSparkle {
            0% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(0.2) translateY(-30px);
                opacity: 0;
            }
        }

        /* ==========================================================================
           3. CONTAINER MOCKUP LAYOUT
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1.5px solid var(--glass-border);
            border-right: 1.5px solid var(--glass-border);
            position: relative;
            z-index: 1;
            padding: 22px 18px 50px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(255, 101, 132, 0.3);
            overflow: hidden;
        }

        /* ==========================================================================
           4. HERO PHOTO FRAME (GAYA BINGKAI PINK AWAL)
           ========================================================================== */
        .hero-photo-card {
            width: 100%;
            background: #ffffff;
            border: 3.5px solid var(--pink-soft);
            border-radius: 28px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hero-photo-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .hero-photo-wrapper {
            width: 100%;
            height: 360px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: var(--pink-light);
        }

        .hero-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            image-rendering: -webkit-optimize-contrast;
            filter: contrast(102%) brightness(102%);
            display: block;
            transition: transform 0.5s ease;
        }

        .hero-photo-card:hover .hero-photo-wrapper img {
            transform: scale(1.03);
        }

        .hero-badge {
            position: absolute;
            bottom: 14px;
            left: 14px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--pink-soft);
            padding: 7px 16px;
            border-radius: 22px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--pink-deep);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--pink-main);
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* ==========================================================================
           5. HEADER & TYPOGRAPHY
           ========================================================================== */
        .header {
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #ffe5ec 100%);
            border: 2px solid var(--pink-soft);
            border-radius: var(--radius-medium);
            padding: 18px 14px;
            box-shadow: 0 6px 20px rgba(255, 101, 132, 0.12);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
            pointer-events: none;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--pink-deep);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* ==========================================================================
           6. GRID & CARD ITEMS
           ========================================================================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card-item {
            background: #ffffff;
            border: 2px solid var(--pink-soft);
            border-radius: var(--radius-medium);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 18px rgba(255, 101, 132, 0.12);
            position: relative;
            overflow: hidden;
        }

        .card-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
            pointer-events: none;
        }

        .card-item:hover {
            transform: translateY(-4px);
            border-color: var(--pink-main);
            box-shadow: var(--shadow-glow);
        }

        .card-item:active {
            transform: scale(0.93);
            background: var(--pink-light);
        }

        .card-item .icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
        }

        .card-item:hover .icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-item .card-title {
            font-size: 0.83rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.35;
        }

        /* ==========================================================================
           7. LOCK SCREEN STYLES
           ========================================================================== */
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 224, 230, 0.97);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s;
        }

        .lock-time {
            font-size: 4rem;
            font-weight: 300;
            color: var(--pink-deep);
            text-shadow: 0 4px 20px rgba(217, 4, 41, 0.18);
            letter-spacing: -1px;
            margin-bottom: 2px;
        }

        .lock-date {
            font-size: 0.95rem;
            color: var(--pink-main);
            margin-bottom: 28px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid var(--pink-soft);
        }

        .lock-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 700;
            text-align: center;
        }

        .pin-dots {
            display: flex;
            gap: 16px;
            margin-bottom: 35px;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid var(--pink-main);
            transition: all 0.2s ease;
            background: transparent;
        }

        .dot.active {
            background: var(--pink-main);
            box-shadow: 0 0 12px var(--pink-main);
            transform: scale(1.1);
        }

        .dot.error {
            animation: shake 0.4s ease-in-out;
            border-color: var(--pink-deep);
            background: var(--pink-deep);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 280px;
        }

        .key {
            aspect-ratio: 1;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--pink-soft);
            color: var(--pink-deep);
            font-size: 1.45rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 101, 132, 0.15);
            transition: all 0.15s ease;
        }

        .key:active {
            background: var(--pink-main);
            color: #ffffff;
            transform: scale(0.9);
        }

        .key-hint {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 25px;
            text-align: center;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--pink-soft);
        }

        /* ==========================================================================
           8. POPUP MODAL STYLES
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(74, 46, 53, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            border: 3.5px solid var(--pink-soft);
            width: 100%;
            max-width: 370px;
            border-radius: var(--radius-large);
            padding: 26px 22px;
            box-shadow: 0 25px 50px rgba(255, 101, 132, 0.3);
            text-align: center;
            animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        @keyframes modalPop {
            from { transform: scale(0.8) translateY(25px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--pink-deep);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--pink-soft);
        }

        .modal-body {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-dark);
            text-align: left;
        }

        .btn-main {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: var(--radius-small);
            font-weight: 700;
            font-size: 0.88rem;
            margin-top: 18px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 18px rgba(255, 77, 109, 0.32);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .btn-close {
            background: var(--pink-light);
            color: var(--pink-deep);
            border: 2px solid var(--pink-soft);
            margin-top: 10px;
            box-shadow: none;
        }

        /* ==========================================================================
           9. UI COMPONENTS (MUSIC BARS, PROGRESS BARS, ETC.)
           ========================================================================== */
        .music-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            margin: 15px 0;
        }

        .bar-line {
            width: 5px;
            background: var(--pink-main);
            border-radius: 4px;
            animation: bounce 0.6s infinite alternate ease-in-out;
        }

        .bar-line:nth-child(1) { animation-delay: 0.0s; }
        .bar-line:nth-child(2) { animation-delay: 0.15s; }
        .bar-line:nth-child(3) { animation-delay: 0.3s; }
        .bar-line:nth-child(4) { animation-delay: 0.45s; }
        .bar-line:nth-child(5) { animation-delay: 0.6s; }

        @keyframes bounce {
            from { height: 8px; }
            to { height: 32px; }
        }

        .floating-music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #ffffff;
            border: 2.5px solid var(--pink-soft);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(255, 101, 132, 0.3);
            z-index: 900;
            cursor: pointer;
            font-size: 1.4rem;
            transition: transform 0.2s ease;
        }

        .floating-music-btn:active {
            transform: scale(0.9);
        }

        .canvas-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <!-- CANVAS FOR CONFETTI EFFECT -->
    <canvas id="confettiCanvas" class="canvas-confetti"></canvas>

    <!-- FLOATING BACKGROUND ANIMATION -->
    <div class="ambient-bg" id="ambientBg"></div>

    <!-- FLOATING QUICK MUSIC PLAYER BUTTON -->
    <div class="floating-music-btn" id="quickMusicBtn" onclick="toggleQuickMusic()" title="Putar/Jeda Lagu">
        🎵
    </div>

    <!-- LOCK SCREEN INTERFACE -->
    <div id="lockScreen">
        <div class="lock-time" id="lockClock">00:00</div>
        <div class="lock-date">✨ Special 20th Birthday OS</div>
        <div class="lock-title">Masukkan PIN Ulang Tahun Kamu, Acum</div>
        
        <div class="pin-dots" id="pinDots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
            <div class="key" onclick="pressKey('5')">5</div>
            <div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div>
            <div class="key" onclick="pressKey('8')">8</div>
            <div class="key" onclick="pressKey('9')">9</div>
            <div class="key" style="opacity:0; pointer-events:none;"></div>
            <div class="key" onclick="pressKey('0')">0</div>
            <div class="key" onclick="deleteKey()">⌫</div>
        </div>
        <div class="key-hint">PIN: 1310 atau 20</div>
    </div>

    <!-- MAIN APP OS CONTAINER -->
    <div class="app-container">

        <!-- HERO PHOTO CARD (BINGKAI PINK AWAL) -->
        <div class="hero-photo-card">
            <div class="hero-photo-wrapper">
                <img src="https://i.ibb.co.com/vxGVQbjG/IMG-2605.png" alt="Acum & Nasyha">
                <div class="hero-badge">
                    <span class="hero-badge-dot"></span>
                    ✨ Special Birthday Boy • 20th
                </div>
            </div>
        </div>
        
        <!-- HEADER TITLE SECTION -->
        <div class="header">
            <h1>ACUM'S 20th BIRTHDAY 💖</h1>
            <p>Dibuat khusus & tulus untuk kamu yang paling spesial!</p>
        </div>

        <!-- GRID 12 FITUR UTAMA -->
        <div class="grid" id="cardGrid"></div>
    </div>

    <!-- POPUP MODAL DIALOG -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-title" id="mTitle">Menu</div>
            <div class="modal-body" id="mBody">Konten</div>
            <button class="btn-main btn-close" onclick="closeModal()">Tutup Menu ✖</button>
        </div>
    </div>

    <!-- HIDDEN YOUTUBE PLAYER SPACE -->
    <div id="ytPlayerSpace" style="display:none"></div>

    <!-- ==========================================================================
       10. JAVASCRIPT LOGIC & INTERACTION ENGINE
       ========================================================================== -->
    <script>
        /* ----------------------------------------------------------------------
           10.1 BUBBLE GENERATOR & AMBIENT EFFECTS
           ---------------------------------------------------------------------- */
        const bg = document.getElementById('ambientBg');
        for(let i = 0; i < 18; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 24 + 10;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.animationDuration = (Math.random() * 6 + 6) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            bg.appendChild(b);
        }

        // Sparkle effect on click anywhere
        document.addEventListener('click', function(e) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-particle';
            sparkle.innerText = ['✨', '💖', '🌸', '💫'][Math.floor(Math.random() * 4)];
            sparkle.style.left = (e.clientX - 10) + 'px';
            sparkle.style.top = (e.clientY - 10) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1000);
        });

        /* ----------------------------------------------------------------------
           10.2 AUDIO SYNTHESIZER (WEB AUDIO API)
           ---------------------------------------------------------------------- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type = 'sine', duration = 0.15) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playUnlockSound() {
            playTone(523.25, 'sine', 0.1);
            setTimeout(() => playTone(659.25, 'sine', 0.15), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.25), 200);
            setTimeout(() => triggerConfetti(), 300);
        }

        /* ----------------------------------------------------------------------
           10.3 LOCK SCREEN & PIN SYSTEM
           ---------------------------------------------------------------------- */
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('lockClock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000); 
        updateClock();

        let inputPin = "";
        const validPins = ["1310", "2026", "0020", "20"];

        function pressKey(num) {
            playTone(600, 'sine', 0.08);
            if(inputPin.length < 4) {
                inputPin += num;
                updateDots();
                if(inputPin.length === 4 || inputPin === "20") {
                    setTimeout(checkPin, 150);
                }
            }
        }

        function deleteKey() {
            playTone(300, 'sine', 0.08);
            inputPin = inputPin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if(idx < inputPin.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function checkPin() {
            if(validPins.includes(inputPin) || inputPin === "20") {
                playUnlockSound();
                if(ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
                document.getElementById('lockScreen').style.transform = 'translateY(-100%)';
                document.getElementById('lockScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('lockScreen').style.display = 'none', 600);
            } else {
                playTone(180, 'sawtooth', 0.3);
                const dots = document.querySelectorAll('.dot');
                dots.forEach(d => d.classList.add('error'));
                setTimeout(() => {
                    dots.forEach(d => d.classList.remove('error'));
                    inputPin = "";
                    updateDots();
                }, 500);
            }
        }

        /* ----------------------------------------------------------------------
           10.4 YOUTUBE PLAYER INTEGRATION
           ---------------------------------------------------------------------- */
        let ytPlayer;
        let isPlaying = false;
        const tag = document.createElement('script'); 
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {

           ---------------------------------------------------------------------- */
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            confettiParticles = [];
            const colors = ['#ff4d6d', '#ff758c', '#ffb3c1', '#ffffff', '#ffd166'];
            for(let i = 0; i < 70; i++) {
                confettiParticles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            confettiParticles.forEach(p => {
                if(p.alpha > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // gravity
                    p.alpha -= 0.015;
                    p.rotation += p.vRot;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                }
            });
            if(active) requestAnimationFrame(animateConfetti);
        }
