<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acum 20th Birthday Special OS</title>
    <style>
        :root {
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --card-glass: rgba(255, 255, 255, 0.22);
            --text-dark: #1e1b18;
            --text-pink: #d90429;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0d0614;
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND GLOWING BLOBS */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 { width: 300px; height: 300px; background: #ff4d6d; top: -50px; left: -50px; }
        .blob-2 { width: 350px; height: 350px; background: #7209b7; bottom: -80px; right: -50px; animation-delay: -5s; }
        .blob-3 { width: 250px; height: 250px; background: #f72585; top: 40%; left: 30%; animation-duration: 12s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        /* APP CONTAINER / MOCKUP */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: rgba(20, 10, 30, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
            padding: 20px 16px 40px 16px;
            display: flex;
            flex-direction: column;
        }

        /* 1. LOCK SCREEN (PASSCODE) */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 6, 20, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s;
        }
        .lock-time { font-size: 3.5rem; font-weight: 200; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .lock-date { font-size: 0.95rem; color: #ffb3c1; margin-bottom: 30px; font-weight: 500; }
        .lock-title { font-size: 0.9rem; color: rgba(255,255,255,0.8); margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
        
        .pin-dots { display: flex; gap: 15px; margin-bottom: 35px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); transition: 0.2s; }
        .dot.active { background: #ff4d6d; border-color: #ff4d6d; box-shadow: 0 0 12px #ff4d6d; }
        .dot.error { animation: shake 0.4s ease-in-out; border-color: #ff0055; background: #ff0055; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; max-width: 280px; }
        .key {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 1.5rem;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .key:active { background: rgba(255, 77, 109, 0.5); transform: scale(0.92); }
        .key-hint { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 25px; text-align: center; }

        /* HEADER BANNER */
        .header {
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 77, 109, 0.35), rgba(114, 9, 183, 0.35));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 22px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .header h1 { font-size: 1.45rem; font-weight: 800; background: linear-gradient(to right, #ffffff, #ffb3c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin-top: 4px; font-weight: 500; }

        /* GRID 20 CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .card-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
        }
        .card-item:active { transform: scale(0.88); background: rgba(255, 77, 109, 0.3); }
        .card-item .icon { font-size: 1.6rem; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
        .card-item .num-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: #ff4d6d;
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(255, 77, 109, 0.5);
        }

        /* POPUP MODAL GLASSMORPHISM */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: linear-gradient(145deg, rgba(35, 18, 50, 0.9), rgba(20, 10, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 360px;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255,77,109,0.2);
            text-align: center;
            animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            from { transform: scale(0.7) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title { font-size: 1.1rem; font-weight: 700; color: #ff758c; margin-bottom: 12px; }
        .modal-body { font-size: 0.88rem; line-height: 1.6; color: rgba(255,255,255,0.9); }

        .btn-main {
            background: linear-gradient(135deg, #ff4d6d, #ff758c);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-close {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 8px;
        }

        /* WIDGETS SPESIFIK */
        .finger-box { width: 70px; height: 70px; border-radius: 50%; border: 2px dashed #ff4d6d; margin: 15px auto; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; transition: 0.3s; }
        .finger-box.scanning { border-style: solid; box-shadow: 0 0 25px #ff4d6d; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.1); } }

        #gameCanvas { width: 100%; height: 160px; background: rgba(0,0,0,0.3); border-radius: 14px; position: relative; overflow: hidden; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .falling-item { position: absolute; font-size: 24px; cursor: pointer; animation: fallAnim 1.8s linear forwards; }
        @keyframes fallAnim { to { transform: translateY(170px); } }

        .music-bar { display: flex; align-items: center; justify-content: center; gap: 4px; height: 30px; margin: 10px 0; }
        .bar-line { width: 4px; background: #ff4d6d; border-radius: 4px; animation: bounce 0.6s infinite alternate ease-in-out; }
        .bar-line:nth-child(2) { animation-delay: 0.15s; }
        .bar-line:nth-child(3) { animation-delay: 0.3s; }
        .bar-line:nth-child(4) { animation-delay: 0.45s; }
        @keyframes bounce { from { height: 6px; } to { height: 26px; } }

        /* CAMERA SALTING DENGAN FOTO */
        .cam-frame { width: 100%; height: 200px; background: #000; border-radius: 14px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px solid #ff4d6d; }
        .cam-frame img { width: 100%; height: 100%; object-fit: cover; }
        .cam-scanline { position: absolute; width: 100%; height: 3px; background: #ff4d6d; top: 0; animation: scan 1.5s infinite linear; box-shadow: 0 0 12px #ff4d6d; z-index: 2; }
        .cam-overlay-text { position: absolute; bottom: 8px; left: 0; width: 100%; background: rgba(0,0,0,0.65); padding: 5px; z-index: 3; }
        @keyframes scan { to { top: 100%; } }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- LOCK SCREEN -->
    <div id="lockScreen">
        <div class="lock-time" id="lockClock">00:00</div>
        <div class="lock-date">Selasa, 13 Oktober 2026</div>
        <div class="lock-title">Masukkan PIN Ulang Tahun Acum</div>
        
        <div class="pin-dots" id="pinDots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container">
        <div class="header">
            <h1>ACUM'S 20th ULTIMATE OS 👑</h1>
            <p>Glassmorphic Edition • Spesial Hari Ulang Tahun</p>
        </div>

        <div class="grid" id="cardGrid"></div>
    </div>

    <!-- POPUP MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-title" id="mTitle">Fitur</div>
            <div class="modal-body" id="mBody">Konten</div>
            <button class="btn-main btn-close" onclick="closeModal()">Tutup Menu ✖</button>
        </div>
    </div>

    <div id="ytPlayerSpace" style="display:none"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type = 'sine', duration = 0.15) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playUnlockSound() {
            playTone(440, 'triangle', 0.1);
            setTimeout(() => playTone(880, 'triangle', 0.2), 100);
            setTimeout(() => playTone(1320, 'sine', 0.3), 200);
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('lockClock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000); updateClock();

        let inputPin = "";
        const validPins = ["1310", "2026", "0020", "20"];

        function pressKey(num) {
            playTone(600, 'sine', 0.08);
            if(inputPin.length < 4) {
                inputPin += num;
                updateDots();
                if(inputPin.length === 4 || inputPin === "20") {
                    setTimeout(checkPin, 150);
                }
            }
        }

        function deleteKey() {
            playTone(300, 'sine', 0.08);
            inputPin = inputPin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if(idx < inputPin.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function checkPin() {
            if(validPins.includes(inputPin) || inputPin === "20") {
                playUnlockSound();
                document.getElementById('lockScreen').style.transform = 'translateY(-100%)';
                document.getElementById('lockScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('lockScreen').style.display = 'none', 600);
            } else {
                playTone(150, 'sawtooth', 0.3);
                const dots = document.querySelectorAll('.dot');
                dots.forEach(d => d.classList.add('error'));
                setTimeout(() => {
                    dots.forEach(d => d.classList.remove('error'));
                    inputPin = "";
                    updateDots();
                }, 500);
            }
        }

        let ytPlayer;
        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayerSpace', {
                height: '0', width: '0', videoId: 'Hr0AAqHLLSg',
                playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'Hr0AAqHLLSg' }
            });
        }

        /* DIRECT IMAGE LINK FROM IMGBB PAGE */
        const photoUrl = "https://i.ibb.co.com/wNXBwTzX/image.jpg";

        const cards = [
            { icon: "💌", title: "1. Surat Pembuka Nyaman", body: "Selamat ulang tahun yang ke-20, Acum sayang! 🎂<br><br>Di umur kepala dua ini, semoga makin dewasa, sehat selalu, dan lancar rezekinya. Makasih udah selalu sabar ngadepin aku selama ini. You are my safe place! 💕" },
            { icon: "🔮", title: "2. Pengacak Doa Manis", body: "<p id='dBox'>Klik tombol di bawah buat kocok doa hari ini!</p><button class='btn-main' onclick='acakDoa()'>Kocok Doa ✨</button>" },
            { icon: "🎟️", title: "3. Vending Kupon Hadiah", body: "<p id='kBox'>Ambil tiket hadiah nyata khusus dari aku!</p><button class='btn-main' onclick='ambilKupon()'>Klaim Tiket 🪙</button>" },
            { icon: "❤️", title: "4. Tamagotchi Hati Acim", body: "<p>Rawat mood aku biar ga gampang ngambek hari ini:</p><div style='background:rgba(255,255,255,0.1); height:12px; border-radius:6px; margin:15px 0; overflow:hidden;'><div id='mBar' style='width:50%; height:100%; background:#ff4d6d; transition:0.3s;'></div></div><button class='btn-main' onclick='tambahMood()'>Kirim Pelukan (+20%) 🤗</button>" },
            { icon: "🎮", title: "5. Game Tangkap Kue Ultah", body: "<p>Tangkap 5 kue jatuh! Skor: <span id='skor' style='color:#ff758c; font-weight:bold;'>0</span></p><div id='gameCanvas'></div>" },
            { icon: "📸", title: "6. Digital Memory Album", body: "🌌 <strong>Momen Favorit:</strong> Ingat pas kita jalan bareng dan kamu ketawa denger cerita random aku? Momen simpel tapi paling bikin aku bahagia banget!" },
            { icon: "🎵", title: "7. Pemutar Latar Musik", body: "<p>Lagu romantis sudah terintegrasi otomatis.</p><div class='music-bar'><div class='bar-line'></div><div class='bar-line'></div><div class='bar-line'></div><div class='bar-line'></div></div><button class='btn-main' style='background:#2ec4b6;' onclick='ytPlayer.playVideo()'>▶ Play</button><button class='btn-main' style='background:#e71d36; margin-top:5px;' onclick='ytPlayer.pauseVideo()'>⏸ Pause</button>" },
            { icon: "📷", title: "8. Detektor Salting Face Scan", body: `<div class="cam-frame"><img src="${photoUrl}" onerror="this.src='https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400';" alt="Acum"><div class="cam-scanline"></div><div class="cam-overlay-text"><p id="camTxt" style="font-size:0.8rem; font-weight:bold; color:#ffb3c1;">Menguji Tingkat Salting...</p></div></div><button class="btn-main" onclick="scanSalting()">Pindai Wajah Acum ⚡</button>` },
            { icon: "☝️", title: "9. Pindai Sidik Jari Bucin", body: "<p>Tahan jempol kamu di bawah untuk verifikasi:</p><div class='finger-box' id='fBox' onmousedown='startFinger()' onmouseup='endFinger()' ontouchstart='startFinger()' ontouchend='endFinger()'>👍</div><p id='fTxt' style='font-size:0.75rem; color:#ffb3c1;'>Tekan & Tahan 2 Detik</p>" },
            { icon: "✍️", title: "10. Catatan Wishlist Acum", body: "<textarea style='width:100%; height:70px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:10px; color:white; padding:8px; font-size:0.8rem; resize:none;' placeholder='Tulis keinginan kamu di umur 20...'></textarea><button class='btn-main' onclick='alert(\"Catatan tersimpan!\")'>Simpan Ke Sistem</button>" },
            { icon: "🍫", title: "11. Vending Cokelat Manis", body: "🍫 *KLIK!* Satu batang cokelat digital termanis berhasil dikirim ke layar HP Acum ter-ganteng hari ini!" },
            { icon: "🩹", title: "12. Penawar Instan Ngambek", body: "Kapsul Penenang Instan! 💊<br>Kalau nanti aku tiba-tiba ngambek atau rewel, kamu berhak nunjukkin fitur nomor 12 ini buat bikin aku jinak lagi. 🤪" },
            { icon: "🗺️", title: "13. Rencana Target Berdua", body: "<div style='text-align:left; font-size:0.85rem; line-height:2;'><input type='checkbox' checked disabled> Lulus & Sukses Karir<br><input type='checkbox' checked disabled> Culinary Date Berdua<br><input type='checkbox' checked disabled> Menua Bersama Selamanya</div>" },
            { icon: "🔔", title: "14. Pengingat Sehat Sayang", body: "Jangan terlalu sibuk main game/kerja ya. Inget minum air putih hari ini, aku ga mau kamu sampai sakit! 🥤" },
            { icon: "🥳", title: "15. Efek Pesta Konfeti", body: "🎉 KABOOM! Selamat Ulang Tahun yang paling meriah untuk cowok kesayangan aku! 🎉" },
            { icon: "💡", title: "16. Pesan Motivasi Umur 20", body: "\"Kamu jauh lebih hebat dan kuat dari apa yang kamu pikirkan. Selamat memasuki usia 20 tahun dengan percaya diri!\" 💪✨" },
            { icon: "🤝", title: "17. Kontrak Janji Setia", body: "Dengan membuka fitur ini, Acum berjanji akan selalu sayang sama Acim, bersabar menghadapi segala drama kecil, dan tidak berpaling. ❤️" },
            { icon: "🔋", title: "18. Pengisi Energi Jiwa", body: "🔋 *BZZZT...* Daya energi jiwa kamu sedang diisi ulang 100% pakai pasokan cinta penuh dari aku!" },
            { icon: "✨", title: "19. Efek Hujan Balon", body: "🎈 Atmosfer kebahagiaan pesta ulang tahunmu diciptakan khusus biar HP kamu terasa sangat meriah!" },
            { icon: "🔒", title: "20. Surat Terkunci Kapsul Waktu", body: "🔒 <strong>Pesan Rahasia Terakhir:</strong><br><br>Makasih udah buka semua fiturnya sampai nomor 20! Kamu beneran cowok terbaik yang pernah ada di hidup aku. Jangan pernah bosan sama aku ya. Happy 20th Birthday, Acum sayang! 🤍✨" }
        ];

        const gridEl = document.getElementById('cardGrid');
        cards.forEach((c, i) => {
            const card = document.createElement('div');
            card.className = 'card-item';
            card.onclick = () => openCard(i);
            card.innerHTML = `<span class="icon">${c.icon}</span><span class="num-badge">${i+1}</span>`;
            gridEl.appendChild(card);
        });

        function openCard(idx) {
            playTone(800, 'sine', 0.1);
            document.getElementById('mTitle').innerText = cards[idx].title;
            document.getElementById('mBody').innerHTML = cards[idx].body;
            document.getElementById('modal').style.display = 'flex';
            if(idx === 4) startMiniGame();
        }

        function closeModal() {
            playTone(400, 'sine', 0.08);
            document.getElementById('modal').style.display = 'none';
        }

        function acakDoa() {
            playTone(900, 'sine', 0.1);
            const list = ["Semoga makin lancar rezekinya! 💸", "Semoga sehat terus badan & jiwanya! 💪", "Semoga makin sayang sama aku! 🥰"];
            document.getElementById('dBox').innerText = list[Math.floor(Math.random()*list.length)];
        }

        function ambilKupon() {
            playTone(1000, 'triangle', 0.15);
            const listK = ["🎟️ Kupon Traktir Es Krim Jumbo", "🎟️ Kupon Peluk 10 Menit", "🎟️ Kupon Bebas Pilih Tempat Makan"];
            document.getElementById('kBox').innerHTML = `<strong>Tiket Keluar:</strong><br>${listK[Math.floor(Math.random()*listK.length)]} (Screenshot!)`;
        }

        let mVal = 50;
        function tambahMood() {
            playTone(1100, 'sine', 0.1);
            mVal = Math.min(100, mVal + 20);
            document.getElementById('mBar').style.width = mVal + '%';
        }

        let gScore = 0;
        function startMiniGame() {
            gScore = 0;
            const area = document.getElementById('gameCanvas');
            area.innerHTML = '';
            const iv = setInterval(() => {
                if(document.getElementById('modal').style.display === 'none' || gScore >= 5) { clearInterval(iv); return; }
                const item = document.createElement('div');
                item.className = 'falling-item'; item.innerText = '🍰';
                item.style.left = Math.random() * (area.clientWidth - 30) + 'px'; item.style.top = '0px';
                item.onclick = () => {
                    playTone(1200, 'sine', 0.08);
                    gScore++; document.getElementById('skor').innerText = gScore; item.remove();
                    if(gScore === 5) alert("Hebat! Target 5 Kue Terkumpul! 🏆");
                };
                area.appendChild(item);
                setTimeout(() => item.remove(), 1700);
            }, 800);
        }

        function scanSalting() {
            playTone(700, 'sawtooth', 0.2);
            document.getElementById('camTxt').innerText = "Memindai Rona Pipi...";
            setTimeout(() => {
                playTone(1400, 'sine', 0.3);
                document.getElementById('camTxt').innerText = "RESULT: 1000% SALTING MAMPUS! 😳❤️";
            }, 1500);
        }

        let fTimer;
        function startFinger() {
            playTone(500, 'sine', 0.1);
            document.getElementById('fBox').classList.add('scanning');
            document.getElementById('fTxt').innerText = "Memindai...";
            fTimer = setTimeout(() => {
                playTone(1500, 'sine', 0.3);
                document.getElementById('fTxt').innerText = "VERIFIED: 9999% BUCIN PARAH! 🥰";
            }, 1800);
        }
        function endFinger() {
            clearTimeout(fTimer);
            document.getElementById('fBox').classList.remove('scanning');
        }

        setInterval(() => {
            const p = document.createElement('div');
            p.innerText = ['🎈','🎉','💖','✨'][Math.floor(Math.random()*4)];
            p.style.position = 'fixed';
            p.style.bottom = '-20px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = '20px';
            p.style.pointerEvents = 'none';
            p.style.zIndex = '0';
            p.style.transition = 'transform 4s linear, opacity 4s';
            document.body.appendChild(p);
            setTimeout(() => { p.style.transform = `translateY(-105vh) rotate(${Math.random()*360}deg)`; p.style.opacity = '0'; }, 50);
            setTimeout(() => p.remove(), 4000);
        }, 500);
    </script>
</body>
</html>
